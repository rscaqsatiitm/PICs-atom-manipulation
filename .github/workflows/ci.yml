name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries (gmsh needs libGLU)
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - name: Install
        run: pip install -e .[test]
      - name: Report numbers traced to docs and results
        run: make check-numbers
      - name: Tests
        run: make test
